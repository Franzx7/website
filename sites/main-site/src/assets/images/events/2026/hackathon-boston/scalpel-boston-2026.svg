<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sharpening nf-core scalpel for Boston 2026</title>
  <desc id="desc">A realistic surgical scalpel illustration with metallic blade and handle for the Boston 2026 hackathon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#155eef"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="24"/>
  <circle cx="1020" cy="120" r="7" fill="#facc15" opacity="0.8"/>
  <circle cx="1070" cy="170" r="4" fill="#fde68a" opacity="0.9"/>
  <circle cx="980" cy="175" r="4" fill="#fde68a" opacity="0.9"/>
  <g filter="url(#shadow)" transform="translate(250,170) rotate(-10)">
    <rect x="0" y="122" width="430" height="44" rx="18" fill="url(#steel)" stroke="#64748b" stroke-width="3"/>
    <rect x="300" y="98" width="155" height="92" rx="16" fill="#b6c2d1" stroke="#64748b" stroke-width="3"/>
    <path d="M455 118 L700 86 L730 144 L700 202 L455 170 Z" fill="url(#blade)" stroke="#94a3b8" stroke-width="3"/>
    <path d="M700 86 L825 144 L700 202 L730 144 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <line x1="84" y1="130" x2="84" y2="158" stroke="#64748b" stroke-width="3"/>
    <line x1="122" y1="130" x2="122" y2="158" stroke="#64748b" stroke-width="3"/>
    <line x1="160" y1="130" x2="160" y2="158" stroke="#64748b" stroke-width="3"/>
    <line x1="198" y1="130" x2="198" y2="158" stroke="#64748b" stroke-width="3"/>
    <line x1="236" y1="130" x2="236" y2="158" stroke="#64748b" stroke-width="3"/>
    <line x1="274" y1="130" x2="274" y2="158" stroke="#64748b" stroke-width="3"/>
    <circle cx="348" cy="144" r="8" fill="#64748b"/>
  </g>
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#dbeafe">nf-core hackathon project</text>
  <text x="80" y="420" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Sharpening</text>
  <text x="80" y="500" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#ffffff">nf-core/scalpel</text>
  <text x="80" y="565" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#dbeafe">Boston 2026 • surgical precision • testing • release readiness</text>
</svg>
